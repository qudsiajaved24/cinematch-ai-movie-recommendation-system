    <!-- ================= Mood Movie Chatbot ================= -->
    <style>
        #cmBotBtn{position:fixed;right:1.25rem;bottom:1.25rem;z-index:1000;width:58px;height:58px;border-radius:50%;border:none;cursor:pointer;font-size:1.6rem;background:var(--gold-primary,#f59e0b);color:#090a0f;box-shadow:0 8px 24px rgba(245,158,11,.35);transition:transform .15s}
        #cmBotBtn:hover{transform:scale(1.07)}
        #cmBotBtn:focus-visible,.cm-chip:focus-visible,#cmBotSend:focus-visible{outline:2px solid #fff;outline-offset:2px}
        #cmBotPanel{position:fixed;right:1.25rem;bottom:5.5rem;z-index:1000;width:360px;max-width:calc(100vw - 2rem);height:520px;max-height:calc(100vh - 7.5rem);display:none;flex-direction:column;background:var(--bg-surface,#101422);border:1px solid var(--border-card,#252e46);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden}
        #cmBotPanel.open{display:flex}
        .cm-head{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1rem;background:var(--bg-surface-elevated,#171c2f);border-bottom:1px solid var(--border-subtle,#1e2538);font-weight:700}
        .cm-head small{display:block;font-weight:400;color:var(--text-muted,#8b93a7);font-size:.75rem}
        .cm-x{background:none;border:none;color:inherit;font-size:1.2rem;cursor:pointer}
        #cmBotLog{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem}
        .cm-msg{max-width:88%;padding:.6rem .85rem;border-radius:14px;font-size:.9rem;line-height:1.45;word-wrap:break-word}
        .cm-bot{align-self:flex-start;background:var(--bg-surface-elevated,#171c2f);border:1px solid var(--border-subtle,#1e2538)}
        .cm-user{align-self:flex-end;background:var(--gold-primary,#f59e0b);color:#090a0f;font-weight:600}
        .cm-chips{display:flex;flex-wrap:wrap;gap:.4rem}
        .cm-chip{border:1px solid var(--border-card,#252e46);background:transparent;color:inherit;border-radius:999px;padding:.35rem .75rem;font-size:.82rem;cursor:pointer}
        .cm-chip:hover{border-color:var(--gold-primary,#f59e0b);color:var(--gold-primary,#f59e0b)}
        .cm-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;align-self:stretch}
        .cm-card{display:block;text-decoration:none;color:inherit;background:var(--bg-surface-elevated,#171c2f);border:1px solid var(--border-subtle,#1e2538);border-radius:10px;overflow:hidden}
        .cm-card:hover{border-color:var(--gold-primary,#f59e0b)}
        .cm-poster{aspect-ratio:2/3;background:#0d1020;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
        .cm-poster img{width:100%;height:100%;object-fit:cover;display:block}
        .cm-card-info{padding:.45rem .55rem;font-size:.78rem}
        .cm-card-info strong{display:block;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .cm-card-info span{color:var(--text-muted,#8b93a7)}
        .cm-form{display:flex;gap:.5rem;padding:.7rem;border-top:1px solid var(--border-subtle,#1e2538)}
        #cmBotInput{flex:1;min-width:0;padding:.55rem .8rem;border-radius:999px;border:1px solid var(--border-card,#252e46);background:var(--bg-main,#090a0f);color:inherit;font:inherit;font-size:.9rem}
        #cmBotSend{border:none;border-radius:999px;padding:0 1rem;background:var(--gold-primary,#f59e0b);color:#090a0f;font-weight:700;cursor:pointer}
    </style>

    <button type="button" id="cmBotBtn" aria-label="Open movie mood assistant" aria-expanded="false">💬</button>
    <section id="cmBotPanel" role="dialog" aria-label="Movie mood assistant">
        <div class="cm-head">
            <div>🎬 Movie Mood Assistant<small>Tell me how you feel, I'll pick a movie</small></div>
            <button type="button" class="cm-x" id="cmBotClose" aria-label="Close chat">✕</button>
        </div>
        <div id="cmBotLog" aria-live="polite"></div>
        <form class="cm-form" id="cmBotForm" autocomplete="off">
            <input type="text" id="cmBotInput" placeholder="e.g. I feel stressed today" aria-label="Describe your mood" maxlength="120">
            <button type="submit" id="cmBotSend">Send</button>
        </form>
    </section>

    <script>
    (function () {
        var MOODS = [
            { key: 'happy',     label: '😄 Happy',      words: ['happy','good','great','joy','cheerful','fun','excited about life','awesome'], genres: ['Comedy','Adventure','Family'], reply: "Love that energy! Here are some feel-good picks:" },
            { key: 'sad',       label: '😢 Sad',        words: ['sad','down','cry','depressed','low','heartbroken','upset','blue','unhappy'], genres: ['Comedy','Family','Drama'], reply: "I'm sorry you're feeling low. Here are some comforting movies:" },
            { key: 'stressed',  label: '😮‍💨 Stressed',  words: ['stress','anxious','tired','exhausted','overwhelmed','relax','calm','chill','burnt','burned'], genres: ['Animation','Comedy','Family'], reply: "Time to unwind. These are light and easy to watch:" },
            { key: 'romantic',  label: '❤️ Romantic',   words: ['love','romantic','romance','date','crush','relationship'], genres: ['Romance','Drama'], reply: "Aww! Here are some romantic picks:" },
            { key: 'excited',   label: '🔥 Pumped',     words: ['pumped','adrenaline','energetic','action','thrill','hyped','powerful','motivated'], genres: ['Action','Thriller','Adventure'], reply: "Let's get the adrenaline going! Try these:" },
            { key: 'scared',    label: '😱 Want a scare', words: ['scary','scared','horror','spooky','creepy','fright','fear'], genres: ['Horror','Thriller'], reply: "Lights off, volume up. Here are some scary ones:" },
            { key: 'curious',   label: '🧠 Thoughtful', words: ['think','thoughtful','curious','mind','smart','deep','mystery','twist','puzzle'], genres: ['Science Fiction','Mystery','Drama'], reply: "Something to make you think. Check these out:" },
            { key: 'bored',     label: '🥱 Bored',      words: ['bored','boring','nothing to do','random','surprise'], genres: ['Adventure','Fantasy','Comedy'], reply: "Let's fix that boredom. Here are some fun adventures:" },
            { key: 'lonely',    label: '🫂 Lonely',     words: ['lonely','alone','miss','homesick'], genres: ['Drama','Romance','Family'], reply: "You're not alone. Here are some warm, heartfelt movies:" },
            { key: 'angry',     label: '😤 Angry',      words: ['angry','mad','frustrated','annoyed','furious','rage'], genres: ['Action','Crime','Thriller'], reply: "Let it out with these intense picks:" },
            { key: 'magic',     label: '✨ Magical',    words: ['magic','fantasy','dream','wonder','imagination','kids','family'], genres: ['Fantasy','Animation','Family'], reply: "Here's a little magic for you:" }
        ];
        var MOVIE_URL = "{{ url_for('movie_detail', movie_id=0) }}";
        var SEARCH_URL = "{{ url_for('api_search') }}";

        var btn = document.getElementById('cmBotBtn'), panel = document.getElementById('cmBotPanel'),
            log = document.getElementById('cmBotLog'), form = document.getElementById('cmBotForm'),
            input = document.getElementById('cmBotInput'), started = false;

        function esc(t){ var d=document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
        function scroll(){ log.scrollTop = log.scrollHeight; }
        function say(text, who){ var m=document.createElement('div'); m.className='cm-msg '+(who==='user'?'cm-user':'cm-bot'); m.textContent=text; log.appendChild(m); scroll(); return m; }
        function chips(){
            var w=document.createElement('div'); w.className='cm-chips';
            MOODS.forEach(function(m){ var b=document.createElement('button'); b.type='button'; b.className='cm-chip'; b.textContent=m.label; b.onclick=function(){ say(m.label,'user'); recommend(m); }; w.appendChild(b); });
            log.appendChild(w); scroll();
        }
        function detect(text){
            var t=text.toLowerCase(), best=null, score=0;
            MOODS.forEach(function(m){ var s=0; m.words.forEach(function(w){ if(t.indexOf(w)!==-1) s++; }); if(s>score){score=s;best=m;} });
            return best;
        }
        function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;} return a; }

        function recommend(mood){
            var typing = say('Finding movies for you…','bot');
            Promise.all(mood.genres.map(function(g){
                return fetch(SEARCH_URL+'?q='+encodeURIComponent(g)).then(function(r){return r.json();}).catch(function(){return [];});
            })).then(function(lists){
                var seen={}, pool=[];
                lists.forEach(function(l){ (l||[]).forEach(function(m){ if(!seen[m.id] && Number(m.vote_average)>=6){ seen[m.id]=1; pool.push(m); } }); });
                typing.remove();
                if(!pool.length){ say("Sorry, I couldn't find matches right now. Try another mood!",'bot'); chips(); return; }
                say(mood.reply,'bot');
                var cards=document.createElement('div'); cards.className='cm-cards';
                shuffle(pool).slice(0,4).forEach(function(m){
                    var a=document.createElement('a'); a.className='cm-card'; a.href=MOVIE_URL.replace(/0$/, m.id);
                    var poster = m.poster_url ? '<img src="'+esc(m.poster_url)+'" alt="" loading="lazy" onerror="this.parentNode.textContent=\'🎬\'">' : '🎬';
                    a.innerHTML='<div class="cm-poster">'+poster+'</div><div class="cm-card-info"><strong>'+esc(m.title)+'</strong><span>'+esc(m.release_year)+' · ★ '+esc(m.vote_average)+'</span></div>';
                    cards.appendChild(a);
                });
                log.appendChild(cards);
                say('Want different picks? Tell me another mood or tap one below.','bot'); chips();
            });
        }

        function open(){
            panel.classList.add('open'); btn.setAttribute('aria-expanded','true');
            if(!started){ started=true; say("Hi! 👋 How are you feeling today? Type your mood or tap one below, and I'll suggest movies.",'bot'); chips(); }
            setTimeout(function(){ input.focus(); },50);
        }
        function close(){ panel.classList.remove('open'); btn.setAttribute('aria-expanded','false'); btn.focus(); }
        btn.onclick=function(){ panel.classList.contains('open') ? close() : open(); };
        document.getElementById('cmBotClose').onclick=close;
        document.addEventListener('keydown',function(e){ if(e.key==='Escape' && panel.classList.contains('open')) close(); });

        form.addEventListener('submit',function(e){
            e.preventDefault();
            var text=input.value.trim(); if(!text) return;
            input.value=''; say(text,'user');
            var mood=detect(text);
            if(mood){ recommend(mood); }
            else { say("I'm not sure I caught your mood. Try words like happy, sad, stressed, romantic, bored, or pick one below.",'bot'); chips(); }
        });
    })();
    </script>
    <!-- ================= End Mood Movie Chatbot ================= -->
