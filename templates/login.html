{% extends "base.html" %}

{% block title %}Log In — CineMatch AI{% endblock %}

{% block content %}
<div class="auth-page-container">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🎬</span>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to access your Watchlist and tailored recommendations.</p>
        </div>

        {% if error %}
            <div class="auth-error-alert">
                <span>⚠️ {{ error }}</span>
            </div>
        {% endif %}

        <form action="{{ url_for('login', next=request.args.get('next')) }}" method="POST" class="auth-form">

            <div class="form-group">
                <label for="identifier" class="form-label">Username or Email</label>
                <input
                    type="text"
                    id="identifier"
                    name="identifier"
                    class="form-input"
                    placeholder="Enter your username or email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-input"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('password', this)"
                        aria-label="Show password"
                        title="Show password"
                    >
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-submit-btn">
                Log In
            </button>
        </form>

        <div class="auth-footer-prompt">
            Don't have an account yet?
            <a href="{{ url_for('signup') }}" class="text-gold font-bold">Sign Up</a>
        </div>
    </div>
</div>

<style>
    .password-wrapper {
        position: relative;
        width: 100%;
    }

    .password-wrapper .form-input {
        width: 100%;
        padding-right: 45px;
        box-sizing: border-box;
    }

    .toggle-password {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        display: flex;
        align-items: center;
        justify-content: center;
        width: 28px;
        height: 28px;
        padding: 4px;
        border: none;
        background: transparent;
        color: #888;
        cursor: pointer;
        z-index: 2;
    }

    .toggle-password svg {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .toggle-password:hover {
        color: #d4af37;
    }

    .toggle-password:focus-visible {
        outline: 2px solid #d4af37;
        border-radius: 4px;
    }
</style>

<script>
    function togglePassword(inputId, button) {
        const passwordInput = document.getElementById(inputId);

        if (!passwordInput) {
            return;
        }

        if (passwordInput.type === "password") {
            passwordInput.type = "text";

            button.setAttribute("aria-label", "Hide password");
            button.setAttribute("title", "Hide password");

            // Display the eye with a slash.
            button.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 3l18 18"></path>
                    <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
                    <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a15.5 15.5 0 0 1-4 4.7"></path>
                    <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1.1 0 2.1-.2 3-.5"></path>
                </svg>
            `;
        } else {
            passwordInput.type = "password";

            button.setAttribute("aria-label", "Show password");
            button.setAttribute("title", "Show password");

            // Restore the normal eye icon.
            button.innerHTML = `
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            `;
        }
    }
</script>

{% endblock %}
```
